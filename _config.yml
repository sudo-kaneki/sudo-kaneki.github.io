# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------
title: blank
first_name: Writabrata
middle_name:
last_name: Bhattacharya
description: >
  Applied Scientist | LLMs, Speech Deep Learning, MLOps & World Models
keywords: machine-learning, deep-learning, LLM, speech, TTS, STT, MLOps, world-models, reinforcement-learning
lang: en
icon: ⚛️
url: https://sudo-kaneki.github.io
baseurl:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
blog_name: Writabrata's Blog
blog_description: Thoughts on ML, AI, Mathematics & beyond
permalink: /blog/:year/:title/

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jemoji

include: ["_pages"]

exclude:
  - AGENTS.md
  - ANALYTICS.md
  - bin/
  - CLAUDE.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - QUICKSTART.md
  - README.md
  - requirements.txt
  - SEO.md
  - TROUBLESHOOTING.md

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"

# -----------------------------------------------------------------------------
# Minification (production only)
# -----------------------------------------------------------------------------
jekyll-minifier:
  exclude: ["robots.txt"]
  compress_javascript: true
  compress_css: true
