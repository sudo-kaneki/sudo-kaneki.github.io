# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------
title: Writabrata Bhattacharya
first_name: Writabrata
last_name: Bhattacharya
description: >
  Applied Scientist | LLMs, Speech Deep Learning, MLOps & World Models
lang: en
icon: ⚛️
url: https://sudo-kaneki.github.io
baseurl:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
permalink: /blog/:year/:title/

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jemoji

include: ["_pages"]

exclude:
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - requirements.txt
  # The current design has no profile photo — remove this line if one is
  # added back, so assets/img/ publishes normally again.
  - assets/img/
  - assets/rendercv/design.yaml
  - assets/rendercv/locale.yaml
  - assets/rendercv/settings.yaml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"

# -----------------------------------------------------------------------------
# Minification (production only)
# -----------------------------------------------------------------------------
jekyll-minifier:
  exclude: ["robots.txt"]
  compress_javascript: true
  compress_css: true

sass:
  sourcemap: never
  style: compressed
