name: Book feedback
description: Report a mistake or suggest an improvement to "Cracking the ML Interview".
title: "[Book] "
labels: ["book-feedback"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter
      description: Filled in automatically when you use the link at the end of a chapter.
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      description: For example "6.2 Core math" or the heading nearest the problem.
  - type: dropdown
    id: type
    attributes:
      label: What kind of feedback?
      options:
        - Error (wrong math, code, numbers or facts)
        - Unclear explanation
        - Missing topic or interview question
        - Other suggestion
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong or missing, and what would you change it to?
    validations:
      required: true
