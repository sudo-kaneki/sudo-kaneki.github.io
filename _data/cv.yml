      # EnergyAI (2024-07 → 2026-04) → Senior Applied Scientist on Machine-
      # Readable Government (2026-04 → present). Each title period is its own
      # entry — RenderCV bullets every highlight, so a real entry is the only
      # way to a flush-left header, and two entries let the promotion read
      # plainly. The homepage timeline (_includes/timeline.liquid) dedupes by
      # company AND title, so both roles show as a progression instead of
      # collapsing into one row.
      #
      # Keyword bolding is deliberate: 2–3 load-bearing terms per bullet so a
      # recruiter (and an ATS-skimming human) gets the gist from the bold words
      # alone. Bolding is markdown, so it renders on the /cv/ page and the PDF.
